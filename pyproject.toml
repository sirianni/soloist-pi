[project]
name = "soloist-pi"
version = "0.1.0"
description = "Python supervisor for Spotify Soloist on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
soloist-pi = "soloist_pi.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "respx>=0.22,<1",
    "ruff>=0.9.6",
    "ty>=0.0.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
