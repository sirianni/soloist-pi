---
- name: Deploy the soloist-pi supervisor
  hosts: all
  become: true
  gather_facts: true

  vars:
    wheel_candidates: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../dist/soloist_pi-*.whl') }}"
    wheel_path: "{{ wheel_candidates | first | default('') }}"
    python_executable: "{{ ansible_facts['python']['executable'] }}"
    device_name: Ceiling Speakers
    cache_size_mb: null
    pipewire_device: null
    initial_volume: null
    websocket_address: null
    service_user: soloist
    service_group: "{{ service_user }}"
    service_home: /var/lib/soloist
    pipewire_user: pi
    pipewire_runtime_mode: "0711"
    pipewire_start_timeout_sec: 180
    state_dir: "{{ service_home }}/state"
    data_dir: "{{ state_dir }}/soloist"
    config_dir: "{{ service_home }}/config"
    bin_dir: "{{ service_home }}/bin"
    cache_dir: /var/cache/soloist
    app_root: /opt/soloist
    venv_dir: "{{ app_root }}/venv"
    config_path: "{{ config_dir }}/config.toml"

  tasks:
    - name: Assert the supported Debian 13 arm64 target and Python runtime
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Debian"
          - ansible_facts["distribution_major_version"] == "13"
          - ansible_facts["architecture"] in ["aarch64", "arm64"]
          - ansible_facts["python_version"] is version("3.13", ">=")
        fail_msg: "soloist deployment requires Debian 13 arm64 and Python 3.13+"

    - name: Require exactly one built soloist-pi wheel
      ansible.builtin.assert:
        that:
          - wheel_candidates | length == 1
        fail_msg: >-
          Expected exactly one dist/soloist_pi-*.whl relative to this playbook;
          run just clean and just build.

    - name: Require a host-provided API key
      ansible.builtin.assert:
        that:
          - api_key is defined
          - api_key | default("") | string | length > 0
        fail_msg: >-
          Set a non-empty api_key in the host entry in ansible/inventory.yaml.
      no_log: true

    - name: Verify target Python provides venv and ensurepip
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - -c
          - import venv, ensurepip
      changed_when: false

    - name: Create the service group
      ansible.builtin.group:
        name: "{{ service_group }}"
        system: true

    - name: Create the unprivileged service account
      ansible.builtin.user:
        name: "{{ service_user }}"
        group: "{{ service_group }}"
        system: true
        home: "{{ service_home }}"
        create_home: true
        shell: /usr/sbin/nologin

    - name: Create root-owned application directory
      ansible.builtin.file:
        path: "{{ app_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create private service runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_group }}"
        mode: "0700"
      loop:
        - "{{ config_dir }}"
        - "{{ state_dir }}"
        - "{{ bin_dir }}"

    - name: Create the Soloist data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_group }}"
        mode: "0700"

    - name: Create cache directory
      ansible.builtin.file:
        path: "{{ cache_dir }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_group }}"
        mode: "0750"

    - name: Look up the PipeWire owner account
      ansible.builtin.getent:
        database: passwd
        key: "{{ pipewire_user }}"

    - name: Validate the PipeWire owner account data
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][pipewire_user] | length == 6
          - ansible_facts['getent_passwd'][pipewire_user][1] | int > 0
          - ansible_facts['getent_passwd'][pipewire_user][4] | length > 0
        fail_msg: "The PipeWire owner account {{ pipewire_user }} is not usable"

    - name: Record PipeWire owner runtime paths
      ansible.builtin.set_fact:
        pipewire_uid: "{{ ansible_facts['getent_passwd'][pipewire_user][1] | int }}"
        pipewire_gid: "{{ ansible_facts['getent_passwd'][pipewire_user][2] | int }}"
        pipewire_home: "{{ ansible_facts['getent_passwd'][pipewire_user][4] }}"
        pipewire_runtime_dir: "/run/user/{{ pipewire_uid }}"

    - name: Look up the PipeWire owner's primary group
      ansible.builtin.getent:
        database: group
        key: "{{ pipewire_gid }}"

    - name: Validate the PipeWire owner's primary group
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_group'] | length == 1
          - (ansible_facts['getent_group'] | dict2items | first).value | length == 3
          - (ansible_facts['getent_group'] | dict2items | first).value[1] | int == pipewire_gid
        fail_msg: "Could not resolve the primary group for {{ pipewire_user }}"

    - name: Record the PipeWire owner's primary group name
      ansible.builtin.set_fact:
        pipewire_group: "{{ ansible_facts['getent_group'] | first }}"

    - name: Enable lingering for the PipeWire owner
      ansible.builtin.command:
        argv:
          - /usr/bin/loginctl
          - enable-linger
          - "{{ pipewire_user }}"
      changed_when: false

    - name: Ensure PipeWire and WirePlumber user services are enabled and running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: user
        enabled: true
        state: started
      loop:
        - pipewire.socket
        - pipewire.service
        - wireplumber.service
      become: true
      become_user: "{{ pipewire_user }}"
      environment:
        HOME: "{{ pipewire_home }}"
        XDG_RUNTIME_DIR: "{{ pipewire_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path={{ pipewire_runtime_dir }}/bus"

    - name: Create the runtime-directory systemd drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/user-runtime-dir@{{ pipewire_uid }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure the PipeWire runtime-directory mode
      ansible.builtin.template:
        src: pipewire-runtime-dir.conf.j2
        dest: "/etc/systemd/system/user-runtime-dir@{{ pipewire_uid }}.service.d/10-pipewire-public.conf"
        owner: root
        group: root
        mode: "0644"

    - name: Create a root-owned Python virtual environment
      ansible.builtin.command:
        argv:
          - "{{ python_executable }}"
          - -m
          - venv
          - "{{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/python"
      register: python_venv

    - name: Stage the exact wheel artifact from the controller
      ansible.builtin.copy:
        src: "{{ wheel_path }}"
        dest: "/tmp/{{ wheel_path | basename }}"
        owner: root
        group: root
        mode: "0644"
      register: wheel_artifact

    - name: Install the wheel into the dedicated virtual environment
      ansible.builtin.command:
        argv:
          - "{{ venv_dir }}/bin/python"
          - -m
          - pip
          - install
          - --force-reinstall
          - "/tmp/{{ wheel_path | basename }}"
      when: wheel_artifact.changed or python_venv.changed
      changed_when: true
      notify: Restart soloist

    - name: Install private supervisor configuration
      ansible.builtin.template:
        src: soloist.toml.j2
        dest: "{{ config_path }}"
        owner: "{{ service_user }}"
        group: "{{ service_group }}"
        mode: "0600"
      no_log: true
      diff: false
      notify: Restart soloist

    - name: Create the Soloist systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/soloist.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install native PipeWire runtime and readiness settings
      ansible.builtin.template:
        src: soloist-pipewire.conf.j2
        dest: /etc/systemd/system/soloist.service.d/10-pipewire.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart soloist

    - name: Install the systemd unit
      ansible.builtin.template:
        src: soloist.service.j2
        dest: /etc/systemd/system/soloist.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart soloist

    - name: Enable and start the service
      ansible.builtin.systemd_service:
        name: soloist.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart soloist
      ansible.builtin.systemd_service:
        name: soloist.service
        state: restarted
        daemon_reload: true
